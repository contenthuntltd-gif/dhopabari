# ============================================================
# Dhopa Bari — nginx inside the container.
#
# The caching rules here are the important part, and they are carried over
# from deploy/nginx-dhopabari.conf for a reason that was learned the hard way:
# the app shell has stable filenames (main.dart.js never changes name), so if
# it is cached, Cloudflare and browsers keep serving the OLD app after a
# deploy. Those files are marked no-store; only the fingerprinted assets are
# allowed a long cache.
#
# TLS is not handled here. Coolify's Traefik terminates HTTPS and forwards
# plain HTTP to this container on port 80.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web is a single-page app: any unknown path has to fall back to
    # index.html, or an in-app link opened directly (or a refresh on a deep
    # link) returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app shell. Stable names, so it must never be cached - this is what
    # makes a deploy visible immediately instead of days later.
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js|flutter\.js|version\.json|manifest\.json|AssetManifest[^/]*|FontManifest\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Hashed and immutable assets - fonts, images, wasm. These do not gate the
    # app version, so they are safe to cache.
    location ~* \.(?:css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf|wasm)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    client_max_body_size 10m;
}
